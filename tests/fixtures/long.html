<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Long Page</title>
<style>body{font-family:system-ui;margin:0;padding:40px;line-height:1.9;max-width:720px;margin:auto}
p{margin:0 0 18px}</style></head><body>
<h1>صفحة طويلة للاختبار</h1>
<p>هذه صفحة اختبار طويلة بما يكفي لتجاوز عشر شاشات (E1: ظهور الشريط وتغيّر النسبة).</p>
<div id="blocks"></div>
<script>
const p = 'نص تجريبي للاختبار الآلي. يُكرَّر لتوليد طول كافٍ من الصفحة، ويجب أن يتجاوز الارتفاع الكلي ستة آلاف بكسل حتى تعمل اختبارات التمرير والحفظ والاستعادة بشكل موثوق. ';
let html = '';
for (let i = 0; i < 120; i++) html += '<p>' + i + ' — ' + p + '</p>';
document.getElementById('blocks').innerHTML = html;
</script></body></html>
