<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Nested Scroll</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui}
#scroller{height:100%;overflow-y:auto;padding:40px;box-sizing:border-box;line-height:1.9;max-width:720px;margin:auto}
</style></head><body>
<div id="scroller"><h1>حاوية تمرير داخلية</h1><div id="blocks"></div></div>
<script>
const p='حالة FR-33: التمرير يحدث داخل div وليس على المستند — يجب ألا يظهر الشريط. ';
let h=''; for(let i=0;i<120;i++) h+='<p>'+i+' — '+p+'</p>';
document.getElementById('blocks').innerHTML=h;
</script></body></html>
