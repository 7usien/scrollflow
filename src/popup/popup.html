<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScrollFlow</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <b>ScrollFlow</b>
    <div class="header-actions">
      <button class="lang-btn" id="langToggleBtn" type="button" title="تبديل اللغة / Switch Language">EN</button>
      <button class="gear" id="optionsBtn" aria-label="الإعدادات">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="body" id="popupBody">
    <div class="donut-row">
      <div class="donut">
        <svg width="92" height="92" viewBox="0 0 92 92">
          <circle cx="46" cy="46" r="40" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="8"/>
          <circle id="donutArc" cx="46" cy="46" r="40" fill="none" stroke="url(#g)" stroke-width="8"
                  stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="251.3"/>
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--sf-brand-start)"/>
              <stop offset="55%" stop-color="var(--sf-brand-mid)"/>
              <stop offset="100%" stop-color="var(--sf-brand-end)"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="pct" id="donutPct">0%</div>
      </div>
      <div class="stats">
        <div><b id="statScreens">— شاشة</b><br/><span id="lblScreens">طول الصفحة</span></div>
        <div><b id="statTime">—</b><br/><span id="lblTime">وقت قراءة مُقدَّر</span></div>
      </div>
    </div>

    <button class="site-btn" id="siteBtn" data-action="site-toggle">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
        <rect x="7" y="5" width="4" height="14" rx="1"/>
        <rect x="13" y="5" width="4" height="14" rx="1"/>
      </svg>
      <span id="siteBtnText">إيقاف على هذا الموقع</span>
    </button>

    <div class="row">
      <span id="lblRestore">استعادة موضع التمرير</span>
      <div class="switch" id="restoreSwitch" role="switch" aria-checked="true" tabindex="0"></div>
    </div>

    <div class="row">
      <span id="lblCelebrate">احتفال عند الإكمال</span>
      <div class="switch" id="celebrateSwitch" role="switch" aria-checked="true" tabindex="0"></div>
    </div>

    <div class="row">
      <span id="lblTheme">الستايل</span>
      <select id="themeSelect">
        <option value="aurora">Aurora (تدرج كوني)</option>
        <option value="sunset">Sunset (غروب دافئ)</option>
        <option value="cyberpunk">Cyberpunk (نيون متوهج)</option>
        <option value="minimal">Minimal (نحيف وبسيط)</option>
        <option value="glass">Glass Pill (كبسولة زجاجية)</option>
        <option value="mono">Mono (رمادي كلاسيكي)</option>
      </select>
    </div>

    <div class="row">
      <span id="lblPosition">الموضع</span>
      <select id="positionSelect">
        <option value="right">يمين (رأسي)</option>
        <option value="left">يسار (رأسي)</option>
        <option value="top">أعلى (أفقي)</option>
        <option value="bottom">أسفل (أفقي)</option>
      </select>
    </div>

    <div class="row">
      <span id="lblLength">امتداد الشريط</span>
      <select id="lengthSelect">
        <option value="floating">عائم متمركز (60%)</option>
        <option value="full">كامل 100%</option>
      </select>
    </div>

    <div class="row">
      <span id="lblRadius">انحناء الحواف</span>
      <select id="radiusSelect">
        <option value="subtle">دائرية خفيفة (6px)</option>
        <option value="pill">كبسولة كاملة (999px)</option>
        <option value="sharp">مستطيلة حادة (2px)</option>
      </select>
    </div>

    <div class="row">
      <span id="lblShadow">إظهار الظل والتوهج</span>
      <div class="switch" id="shadowSwitch" role="switch" aria-checked="true" tabindex="0"></div>
    </div>

    <div class="row">
      <span id="lblHideScrollbar">إخفاء سكرول المتصفح</span>
      <div class="switch" id="hideScrollbarSwitch" role="switch" aria-checked="true" tabindex="0"></div>
    </div>

    <div class="row">
      <span id="lblSmoothScroll">تصفح سلس للصفحة</span>
      <div class="switch" id="smoothScrollSwitch" role="switch" aria-checked="true" tabindex="0"></div>
    </div>

    <div class="row">
      <span id="lblBookmarks">هوامش ونقاط الصفحة</span>
      <div class="switch" id="bookmarksSwitch" role="switch" aria-checked="true" tabindex="0"></div>
    </div>
  </div>

  <div class="unsupported-note" id="unsupportedNote">
    الصفحة غير قابلة للقياس أو لا تدعم الإضافة هنا.
  </div>

  <div class="foot">
    <button class="ghost" id="clearBtn">مسح بيانات التمرير</button>
    <span style="font:600 10px var(--sf-font);color:var(--sf-text-dim)">v1.0.0</span>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
